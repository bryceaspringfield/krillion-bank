<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Live rooms</title>
<style>
body{font:14px/1.4 system-ui,sans-serif;margin:16px;color:#1d1d1f;background:#fff}
@media (prefers-color-scheme:dark){body{color:#e8e8ea;background:#16161a}th{background:#24242a!important}tr.nobot td{color:#9a9aa3}}
h1{font-size:18px;margin:0 0 6px}
.stats{margin:8px 0 12px}.st{border-collapse:collapse}.st th,.st td{padding:2px 14px 2px 0;text-align:right}.st th:first-child,.st td:first-child{text-align:left;color:#9a9aa3}.st b{font-size:18px}.ans{margin-top:8px;display:flex;flex-wrap:wrap;gap:22px}.ans b{font-size:18px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
table{border-collapse:collapse;width:100%;max-width:900px}th,td{text-align:left;padding:3px 8px;border-bottom:1px solid #8883}
th{position:sticky;top:0;background:#f3f3f5;cursor:pointer}tr.nobot td{color:#77777f}td.n{text-align:right}
.code{font-family:ui-monospace,monospace}.code a{color:inherit}.code a.w{font:12px system-ui,sans-serif;color:#77777f;margin-left:6px}.two{color:#c0392b;font-weight:600}
.st{font-size:11px;padding:0 4px;border-radius:3px;margin-left:3px}.st-playing{background:#d9f2d9;color:#1d5c1d}.st-watching{background:#f2e6cc;color:#6b4e12}.st-waiting,.st-between-games{background:#e6e6ef;color:#44445a}
</style></head><body>
<h1>Live rooms <a href="https://bryceaspringfield.github.io/krillion-bank/" style="font-size:14px;font-weight:normal;margin-left:10px">Question bank</a></h1>
<div id="when">Loading…</div>
<div class="stats" id="stats"></div>
<div class="bar">
<input id="q" placeholder="Room code or bot name" size="24">
<label><input type="radio" name="f" value="all" checked> All running rooms</label>
<label><input type="radio" name="f" value="bot"> With a bot</label>
<label><input type="radio" name="f" value="nobot"> Without a bot</label>
<label><input type="radio" name="f" value="two"> Two bots or more</label>
</div>
<table><thead><tr><th data-k="0">Room</th><th data-k="1">Phase</th><th data-k="2">Players</th><th data-k="4">Bot display name</th><th data-k="5">Seated</th><th>Why no bot</th></tr></thead><tbody id="tb"></tbody></table>
<script>
// live.json is rewritten every minute by the cluster's writer job and pushed to this repository's `live` branch
var SRC='https://raw.githubusercontent.com/bryceaspringfield/krillion-bank/live/live.json';
var D=null, BD=null, SORT=null, DESC=false;
// on krillion.io (opened by the bookmark) the page reads the site's room list itself, which answers krillion.io's pages only, and joins
// each room with the bots our status files place there (2026-11-09)
var SITE='https://bryceaspringfield.github.io/krillion-bank/', API=location.hostname=='krillion.io';
function ago(s){if(!s)return '';var m=Math.round((Date.now()/1000-s)/60);return m<1?'<1 min':m+' min'}
function agos(s){var x=Math.max(0,Math.round(Date.now()/1000-s));return x<90?x+' s':Math.round(x/60)+' min'}
function why(r){if(r[4].length)return '';if(r[2]>=r[3])return 'Full';if(r[2]==0)return 'No players';return 'Open, no bot yet'}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function draw(){
  if(!D)return;
  var q=document.getElementById('q').value.trim().toLowerCase(), f=document.querySelector('input[name=f]:checked').value;
  var rows=D.rooms.filter(function(r){
    if(f=='bot'&&!r[4].length)return false; if(f=='nobot'&&r[4].length)return false; if(f=='two'&&r[4].length<2)return false;
    if(q&&r[0].toLowerCase().indexOf(q)<0&&!r[4].some(function(b){return String(b[0]).toLowerCase().indexOf(q)>=0}))return false;
    return true});
  // default order: lobbies first, the most open seats first (a lobby with open seats is one a player can join now), then the rest as written
  if(SORT===null)rows=rows.slice().sort(function(a,b){var la=a[1]=='lobby',lb=b[1]=='lobby';if(la!=lb)return la?-1:1;return la?(b[3]-b[2])-(a[3]-a[2]):0});
  if(SORT!==null)rows=rows.slice().sort(function(a,b){
    var x=SORT==4?(a[4][0]||[''])[0]:SORT==5?-((a[4][0]||[0,0])[1]||0):a[SORT], y=SORT==4?(b[4][0]||[''])[0]:SORT==5?-((b[4][0]||[0,0])[1]||0):b[SORT];
    return (x<y?-1:x>y?1:0)*(DESC?-1:1)});
  var h=[];
  rows.forEach(function(r){
    var names=r[4].map(function(b){return esc(b[0])+(b[2]?' <span class="st st-'+b[2].replace(' ','-')+'">'+esc(b[2])+'</span>':'')}).join(', '), since=r[4].map(function(b){return ago(b[1])}).filter(Boolean).join(', ');
    h.push('<tr class="'+(r[4].length?'':'nobot')+'"><td class="code"><a href="https://krillion.io/party/'+esc(r[0])+'" target="_blank" rel="noopener">'+esc(r[0])+'</a>'+(r[4].length?' <a class="w" href="'+SITE+'watch.html?r='+esc(r[0])+'" target="_blank" rel="noopener">watch</a>':'')+'</td><td>'+esc(r[1])+'</td><td class="n">'+r[2]+' of '+r[3]+
      '</td><td'+(r[4].length>1?' class="two"':'')+'>'+names+'</td><td>'+since+'</td><td>'+why(r)+'</td></tr>')});
  document.getElementById('tb').innerHTML=h.join('');
}
function stats(){
  // rooms by phase, each with the rooms where a bot holds a seat (any bot not merely watching) and those where bots only watch
  var P=[['All rooms',null],['Lobbies','lobby'],['Countdown','countdown'],['In a round','round'],['Between games','over']];
  var c={};P.forEach(function(p){c[p[0]]=[0,0,0]});
  (D.rooms||[]).forEach(function(r){var b=r[4]||[],seat=b.some(function(x){return x[2]!=='watching'}),obs=!seat&&b.length>0;
    P.forEach(function(p){if(p[1]===null||p[1]===r[1]){var v=c[p[0]];v[0]++;if(seat)v[1]++;if(obs)v[2]++}})});
  var pc=function(a,b){return a.toLocaleString()+' <small>('+(b?Math.round(100*a/b):0)+'%)</small>'};
  var h='<table class="st"><tr><th></th>'+P.map(function(p){return '<th>'+p[0]+'</th>'}).join('')+'</tr>'+
    '<tr><td>Rooms</td>'+P.map(function(p){return '<td><b>'+c[p[0]][0].toLocaleString()+'</b></td>'}).join('')+'</tr>'+
    '<tr><td>With a bot in a seat</td>'+P.map(function(p){return '<td>'+pc(c[p[0]][1],c[p[0]][0])+'</td>'}).join('')+'</tr>'+
    '<tr><td>With a bot only watching</td>'+P.map(function(p){return '<td>'+pc(c[p[0]][2],c[p[0]][0])+'</td>'}).join('')+'</tr></table>';
  var A=(BD&&BD.answers_recorded_day!=null)?BD:D;
  if(A&&A.answers_recorded_day!=null)h+='<div class="ans"><span><b>'+A.new_answers_day.toLocaleString()+'</b> new answers, last 24 hours</span>'+
    '<span><b>'+(A.answers_recorded_day?(100*A.new_answers_day/A.answers_recorded_day).toFixed(1):'0')+'%</b> of '+A.answers_recorded_day.toLocaleString()+' answers recorded were new</span>'+
    '<span><b>'+(A.answers_unique_day?(100*A.new_answers_day/A.answers_unique_day).toFixed(1):'0')+'%</b> of '+A.answers_unique_day.toLocaleString()+' unique answers seen were new</span></div>';
  document.getElementById('stats').innerHTML=h;
  var t=new Date(D.t*1000);
  document.getElementById('when').textContent='As of '+t.toLocaleTimeString('en-US',{timeZone:'America/New_York'})+' ET ('+agos(D.t)+' ago)';
}
// each push writes a new file s/<slot>.json (slot: the time in 5 s units), since raw.githubusercontent.com keeps any one path 5 minutes;
// a push reaches the raw server 35 to 45 s after its slot (measured 2026-11-09 19:45 ET), so the page walks forward from the last slot it
// loaded until a slot is missing, and on its first load walks back from 10 s ago to 2 minutes ago; live.json is the last fallback
function get(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()})}
var LASTK=0;
function show(d){if(!BD||d.t>=BD.t){BD=d;if(!API){D=d;stats();draw()}}}
// a walk of the room list is serial (each page names the next page's cursor): 24 to 25 pages took 1.6 to 2.1 s (2026-11-10), so the
// page starts the next walk 1 s after the last ends, and waits 5 s after a walk fails
var APIGAP=1000, APIFAIL=5000, APIDT=0;
function apiLoad(){
  var all=[], t0=Date.now(), ok=false;
  function page(cur,n){return fetch('https://party.krillion.io/rooms'+(cur?'?cursor='+encodeURIComponent(cur):''),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    all=all.concat(d.rooms||[]); var c=d.nextCursor||d.cursor; if(c&&(d.rooms||[]).length&&n<45)return page(c,n+1)})}
  page(null,0).then(function(){
    var bots={}; if(BD)BD.rooms.forEach(function(r){if(r[4].length)bots[r[0]]=r[4]});
    var rooms=all.map(function(x){return [x.code,x.phase,x.players,x.maxPlayers,bots[x.code]||[]]});
    var wb=rooms.filter(function(r){return r[4].length}), seated=[].concat.apply([],wb.map(function(r){return r[4]}));
    D={t:Date.now()/1000,rooms:rooms,rooms_running:rooms.length,rooms_with_bot:wb.length,
       rooms_full_without_bot:rooms.filter(function(r){return !r[4].length&&r[2]>=r[3]}).length,
       rooms_empty_without_bot:rooms.filter(function(r){return !r[4].length&&r[2]==0}).length,
       rooms_two_bots:rooms.filter(function(r){return r[4].length>1}).length,bots_seated:seated.length,
       bots_playing:seated.filter(function(b){return b[2]=='playing'}).length,bots_watching:seated.filter(function(b){return b[2]=='watching'}).length};
    APIDT=(Date.now()-t0+APIGAP)/1000; ok=true; stats();draw();
  }).catch(function(){document.getElementById('when').textContent='The room list did not load; retrying in 5 s.'}).then(function(){setTimeout(apiLoad,ok?APIGAP:APIFAIL)});
}
function fwd(B,k,n){return get(B+k+'.json').then(function(d){LASTK=k;show(d);if(n>0)return fwd(B,k+1,n-1)},function(){})}
function back(B,k,lo){return get(B+k+'.json').then(function(d){LASTK=k;show(d)},function(){if(k>lo)return back(B,k-1,lo);throw 0})}
function load(){
  var now=Math.floor(Date.now()/1000/5), B=SRC.replace('live.json','s/');
  var p=(LASTK&&now-LASTK<24)?fwd(B,LASTK+1,6):back(B,now-2,now-24);
  p.catch(function(){return get(SRC+'?t='+Date.now()).then(show)})
  .catch(function(){document.getElementById('when').textContent='The live file did not load; retrying in 5 s.'});
}
document.getElementById('q').oninput=draw;
document.querySelectorAll('input[name=f]').forEach(function(e){e.onchange=draw});
document.querySelectorAll('th[data-k]').forEach(function(th){th.onclick=function(){var k=+th.dataset.k;DESC=(SORT===k)?!DESC:false;SORT=k;draw()}});
load(); setInterval(load,5000); setInterval(function(){if(D)stats()},1000);
if(API){document.title='Live rooms (room list)';apiLoad()}

// the tab reloads itself when a newer copy of this page is published, since an open tab keeps running the code it loaded
var PAGEV='120261110024320';
if(!API)setInterval(function(){fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){var m=t.match(/var PAGEV='(\d+)'/);if(m&&m[1]!==PAGEV)location.reload()}).catch(function(){})},60000);
</script></body></html>
